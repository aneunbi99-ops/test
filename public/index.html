<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#141725"><meta name="description" content="나만의 귀여움을 별자리로 남기는 작은 우주."><title>귀여움 수집소</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/">귀여움 수집소<span class="mark">✦</span></a><a class="jump" href="#garden">STAR MAP ↗</a></header>
<main><section id="draw"><div class="boardframe"><div class="sky-hud"><span>SECTOR 01 / DRAW</span><span class="hud-dot">● REC</span></div><div class="board"><canvas id="canvas" width="1400" height="680" aria-label="크레파스로 별자리 그리기"></canvas><div id="placeholder" class="placeholder">나만의 별자리<span>✧</span></div></div><div class="sky-bottom"><span>✦ CRAYON SIGNAL</span><span>∞ SPACE</span></div></div>
<div class="tools"><div class="palette" aria-label="색상"></div><div class="size" aria-label="굵기"><button data-size="5" aria-label="가는 선"><i style="width:4px;height:4px"></i></button><button class="active" data-size="11" aria-label="보통 선"><i style="width:8px;height:8px"></i></button><button data-size="22" aria-label="굵은 선"><i style="width:12px;height:12px"></i></button></div><div class="utility"><button id="eraser" title="지우개" aria-label="지우개">▱</button><button id="undo" title="되돌리기" aria-label="되돌리기">↶</button><button id="clear" title="전체 지우기" aria-label="전체 지우기">⌫</button></div></div>
<form class="send" onsubmit="return false"><label class="sr" for="nickname">닉네임</label><input id="nickname" maxlength="16" placeholder="닉네임" autocomplete="nickname" required><button id="submit" type="submit">별 띄우기 ↗</button></form></section>
<section class="garden-section" id="garden"><div class="sectionhead"><h1>우리의 우주<span id="count">0 stars</span></h1><span id="status">CONNECTING</span></div><div class="garden" id="world"><div class="ground">첫 번째 별을 띄워주세요.</div></div></section></main><footer>CUTE SAVES THE UNIVERSE. <span>© 귀여움 수집소</span></footer><script src="/firebase-config.js"></script><script type="module" src="/app.js"></script></body></html>
