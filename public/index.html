<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="나만의 귀여움을 별자리로 남기는 작은 우주.">
  <title>귀여움 수집소</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#draw">그리기로 건너뛰기</a>
  <header class="global-nav">
    <nav class="nav-inner" aria-label="전체 메뉴">
      <a class="brand" href="/" aria-label="귀여움 수집소 홈"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Z" fill="currentColor"/></svg><span>귀여움 수집소</span></a>
      <a class="nav-link" href="#garden">우리의 우주</a>
    </nav>
  </header>
  <div class="sub-nav">
    <div class="sub-inner"><a class="site-name" href="#">작은 우주</a><a class="primary small" href="#draw">그리기</a></div>
  </div>
  <main>
    <section class="intro" aria-labelledby="title"><h1 id="title">귀여움으로 채우는 우주.</h1><a class="text-link" href="#garden">모두의 별자리 보기 <span aria-hidden="true">›</span></a></section>
    <section class="drawing-section" id="draw" aria-label="나의 별자리 그리기">
      <div class="drawing-inner">
        <div class="board"><canvas id="canvas" width="1400" height="680" aria-label="크레파스로 별자리 그리기"></canvas><div id="placeholder" class="placeholder"><span class="placeholder-star" aria-hidden="true">✧</span><span>여기, 나만의 별자리.</span></div></div>
        <div class="tools" role="group" aria-label="그리기 도구">
          <div class="palette" role="group" aria-label="크레파스 색상"></div>
          <div class="tool-options"><div class="size" role="group" aria-label="굵기"><button data-size="5" aria-label="가는 선" aria-pressed="false"><i style="width:4px;height:4px"></i></button><button class="active" data-size="11" aria-label="보통 선" aria-pressed="true"><i style="width:8px;height:8px"></i></button><button data-size="22" aria-label="굵은 선" aria-pressed="false"><i style="width:12px;height:12px"></i></button></div><div class="utility"><button id="eraser" title="지우개" aria-label="지우개" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 14 9-10a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-8 9H8l-4-4a2 2 0 0 1 0-3Zm5-5 9 9M12 21h10"/></svg></button><button id="undo" title="되돌리기" aria-label="되돌리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-3"/></svg></button><button id="clear" title="전체 지우기" aria-label="전체 지우기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/></svg></button></div></div>
        </div>
        <form class="send" onsubmit="return false"><label class="sr" for="nickname">닉네임</label><input id="nickname" maxlength="16" placeholder="닉네임" autocomplete="nickname" required><button id="submit" class="primary" type="submit">별 띄우기</button></form>
      </div>
    </section>
    <section class="garden-section" id="garden" aria-labelledby="garden-title"><div class="gallery-inner"><div class="sectionhead"><div><h2 id="garden-title">우리의 우주.</h2><span id="count">0개의 별</span></div><span id="status" role="status">CONNECTING</span></div><div class="garden" id="world"><div class="ground">첫 번째 별을 띄워주세요.</div></div></div></section>
  </main>
  <footer><div class="footer-inner"><span>작은 귀여움이 모이는 곳.</span><span>© 귀여움 수집소</span></div></footer>
  <script src="/firebase-config.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
